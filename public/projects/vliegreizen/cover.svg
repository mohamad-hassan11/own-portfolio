<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Vliegreizen Project Cover</title>
  <desc id="desc">Cover artwork for the Vliegreizen JavaFX flight and travel booking application, showing desktop UI mockups and data streaming indicators.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Decorative technical grid lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Left Hero Details -->
  <g transform="translate(80, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.15"/>
    <text x="110" y="22" fill="#bae6fd" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">OBJECT-ORIENTED JAVA</text>

    <!-- Project Title -->
    <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-1">Vliegreizen</text>
    <text x="0" y="130" fill="#e0f2fe" font-size="20" font-weight="500">Flight &amp; Travel Booking Desktop Platform</text>

    <!-- Subtitle description -->
    <text x="0" y="180" fill="#94a3b8" font-size="15" font-weight="400">JavaFX Desktop MVC Architecture</text>
    <text x="0" y="206" fill="#94a3b8" font-size="15" font-weight="400">Relational Airline &amp; Passenger Booking</text>
    <text x="0" y="232" fill="#94a3b8" font-size="15" font-weight="400">Binary, Object &amp; Text Data Access Objects</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="85" height="30" rx="6" fill="#ffffff" fill-opacity="0.2"/>
      <text x="42" y="19" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Java 11</text>

      <rect x="95" y="0" width="95" height="30" rx="6" fill="#ffffff" fill-opacity="0.2"/>
      <text x="142" y="19" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">JavaFX 13</text>

      <rect x="200" y="0" width="70" height="30" rx="6" fill="#ffffff" fill-opacity="0.2"/>
      <text x="235" y="19" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">MVC</text>

      <rect x="280" y="0" width="105" height="30" rx="6" fill="#ffffff" fill-opacity="0.2"/>
      <text x="332" y="19" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">DAO Pattern</text>
    </g>
  </g>

  <!-- Right Window Frame Mockup -->
  <g transform="translate(560, 85)" filter="url(#dropShadow)">
    <!-- Desktop Window Container -->
    <rect width="560" height="505" rx="12" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M0 12 Q0 0 12 0 L548 0 Q560 0 560 12 L560 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="6" fill="#10b981"/>
    <text x="280" y="24" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Practicumopdracht OOP2 - Mohamad Hassan</text>

    <!-- Window MenuBar -->
    <rect x="0" y="38" width="560" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
    <text x="18" y="55" fill="#334155" font-size="11" font-weight="500">Bestand</text>
    <text x="75" y="55" fill="#334155" font-size="11" font-weight="500">Sorteren</text>

    <!-- Main Content: Form Preview -->
    <g transform="translate(24, 80)">
      <!-- Input 1: Company Name -->
      <text x="0" y="14" fill="#475569" font-size="11" font-weight="600">Bedrijfs naam</text>
      <rect x="110" y="0" width="400" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="122" y="17" fill="#0f172a" font-size="12" font-weight="500">Corendon Airlines</text>

      <!-- Input 2: Origin Country -->
      <text x="0" y="46" fill="#475569" font-size="11" font-weight="600">Land van afkomst</text>
      <rect x="110" y="32" width="400" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="122" y="49" fill="#0f172a" font-size="12" font-weight="500">Nederland / Turkije</text>

      <!-- Input 3: Date -->
      <text x="0" y="78" fill="#475569" font-size="11" font-weight="600">Oprichting jaar</text>
      <rect x="110" y="64" width="400" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="122" y="81" fill="#0f172a" font-size="12">2005-04-12</text>

      <!-- Input 4: Details -->
      <text x="0" y="112" fill="#475569" font-size="11" font-weight="600">Meer Details</text>
      <rect x="110" y="98" width="400" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="122" y="117" fill="#64748b" font-size="11">Chartermaatschappij en touroperator met vluchten binnen en buiten Europa.</text>

      <!-- Save Button -->
      <rect x="215" y="162" width="120" height="28" rx="4" fill="#0284c7"/>
      <text x="275" y="180" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">OPSLAAN</text>

      <!-- ListView Container -->
      <rect x="0" y="202" width="510" height="155" rx="4" fill="#ffffff" stroke="#cbd5e1"/>

      <!-- List Item 1 (Selected) -->
      <rect x="2" y="204" width="506" height="42" fill="#e0f2fe"/>
      <text x="12" y="222" fill="#0369a1" font-size="11" font-weight="700">CORENDON AIRLINES</text>
      <text x="12" y="238" fill="#0284c7" font-size="9">(ID : 1) · AFKOMST : NEDERLAND · OPRICHTJAAR : 2005-04-12</text>

      <!-- List Item 2 -->
      <rect x="2" y="248" width="506" height="42" fill="#ffffff"/>
      <text x="12" y="266" fill="#1e293b" font-size="11" font-weight="700">KLM ROYAL DUTCH AIRLINES</text>
      <text x="12" y="282" fill="#64748b" font-size="9">(ID : 2) · AFKOMST : NEDERLAND · OPRICHTJAAR : 1919-10-07</text>

      <!-- List Item 3 -->
      <rect x="2" y="292" width="506" height="42" fill="#ffffff"/>
      <text x="12" y="310" fill="#1e293b" font-size="11" font-weight="700">TUI FLY NETHERLANDS</text>
      <text x="12" y="326" fill="#64748b" font-size="9">(ID : 3) · AFKOMST : NEDERLAND · OPRICHTJAAR : 2005-04-16</text>

      <!-- Action Buttons Row -->
      <g transform="translate(65, 372)">
        <rect x="0" y="0" width="105" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="52" y="18" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">NIEUWE</text>

        <rect x="125" y="0" width="115" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="182" y="18" fill="#dc2626" font-size="11" font-weight="600" text-anchor="middle">VERWIJDER</text>

        <rect x="260" y="0" width="125" height="28" rx="4" fill="#0284c7"/>
        <text x="322" y="18" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Bekijk Reizen →</text>
      </g>
    </g>
  </g>
</svg>
