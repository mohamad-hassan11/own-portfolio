<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Climate Cleanup application architecture overview</title>
  <desc id="description">Angular communicates with a Spring Boot REST API using JWT bearer tokens. The backend separates controllers, services, and Spring Data JPA repositories. Repositories support MySQL persistence; services integrate with the external CCU hardware or simulator API, Azure storage, and SMTP email.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .heading { font-size: 36px; font-weight: 700; }
      .title { font-size: 28px; font-weight: 700; }
      .detail { font-size: 24px; fill: #334155; }
      .label { font-size: 22px; fill: #334155; }
      .box { stroke: #334155; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="64" y="72" class="heading">Climate Cleanup / EWA</text>
  <text x="64" y="110" class="detail">Application layers and external integrations</text>

  <rect x="64" y="180" width="360" height="260" rx="12" fill="#eff6ff" class="box"/>
  <text x="92" y="227" class="title">Angular client</text>
  <text x="92" y="272" class="detail">TypeScript · RxJS</text>
  <text x="92" y="322" class="detail">Views and HTTP services</text>
  <text x="92" y="362" class="detail">Route guards</text>
  <text x="92" y="402" class="detail">Bearer-token interceptor</text>

  <path d="M 424 310 H 610" class="flow" marker-start="url(#arrow)"/>
  <text x="517" y="260" text-anchor="middle" class="label">REST / JSON</text>
  <text x="517" y="290" text-anchor="middle" class="label">JWT bearer token</text>

  <rect x="620" y="180" width="430" height="560" rx="12" fill="#f8fafc" class="box"/>
  <text x="650" y="227" class="title">Spring Boot backend</text>
  <text x="650" y="266" class="detail">Java 11 · JWT request filter</text>
  <rect x="650" y="300" width="370" height="100" rx="8" fill="#eff6ff" class="box"/>
  <text x="675" y="341" class="title">REST controllers</text>
  <text x="675" y="377" class="detail">Application endpoints</text>
  <path d="M 835 400 V 440" class="flow"/>
  <rect x="650" y="450" width="370" height="100" rx="8" fill="#f0fdf4" class="box"/>
  <text x="675" y="491" class="title">Services</text>
  <text x="675" y="527" class="detail">Business logic · integrations</text>
  <path d="M 835 550 V 590" class="flow"/>
  <rect x="650" y="600" width="370" height="100" rx="8" fill="#fff7ed" class="box"/>
  <text x="675" y="641" class="title">JPA repositories</text>
  <text x="675" y="677" class="detail">Entities and persistence</text>

  <path d="M 1020 500 H 1090 V 270 H 1166" class="flow"/>
  <path d="M 1090 440 H 1166" class="flow"/>
  <path d="M 1090 500 V 610 H 1166" class="flow"/>
  <rect x="1180" y="180" width="356" height="140" rx="12" fill="#f0fdf4" class="box"/>
  <text x="1206" y="225" class="title">External CCU API</text>
  <text x="1206" y="264" class="detail">Hardware or simulator</text>
  <text x="1206" y="299" class="label">Spring WebClient</text>
  <rect x="1180" y="370" width="356" height="140" rx="12" fill="#f5f3ff" class="box"/>
  <text x="1206" y="415" class="title">Azure storage</text>
  <text x="1206" y="454" class="detail">Avatars and attachments</text>
  <text x="1206" y="489" class="label">Backend file service</text>
  <rect x="1180" y="560" width="356" height="140" rx="12" fill="#fff7ed" class="box"/>
  <text x="1206" y="605" class="title">SMTP email</text>
  <text x="1206" y="644" class="detail">Notifications and alerts</text>
  <text x="1206" y="679" class="label">Backend email service</text>

  <path d="M 835 700 V 806" class="flow"/>
  <rect x="620" y="820" width="430" height="110" rx="12" fill="#fff7ed" class="box"/>
  <text x="650" y="866" class="title">MySQL</text>
  <text x="650" y="905" class="detail">Application and sensor data</text>
  <text x="64" y="960" class="label">Overview based on the project summary; deployment and update timing are not depicted.</text>
</svg>
