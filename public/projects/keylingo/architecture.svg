<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KeyLingo Application Architecture</title>
  <desc id="desc">Presentation layer with hidden textarea input capture connects via reactive React hooks to a pure UI-independent domain engine (Unicode processing, typing state machine, PRNG generators) and offline persistence and dictionary services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #172033; }
      .heading { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subheading { font-size: 21px; fill: #475569; }
      .layer-tag { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
      .box-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .box-desc { font-size: 16px; fill: #475569; }
      .box-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; fill: #2563eb; font-weight: 600; }
      .link { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Header -->
  <text x="60" y="60" class="heading">KeyLingo · System Architecture</text>
  <text x="60" y="94" class="subheading">Input capture &amp; presentation → Reactive store hooks → Pure domain engines &amp; Unicode pipeline → Offline services</text>

  <!-- Layer 1: Presentation & Input Capture (Top) -->
  <rect x="60" y="130" width="1480" height="195" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="162" class="layer-tag" fill="#475569">PRESENTATION &amp; INPUT LAYER · NEXT.JS 15 (APP ROUTER) / REACT 19 / TAILWIND CSS</text>

  <!-- Hidden Textarea Input Capture -->
  <rect x="85" y="180" width="330" height="125" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="212" class="box-title">Input Capture Pipeline</text>
  <text x="105" y="240" class="box-desc">Hidden &lt;textarea&gt; capture</text>
  <text x="105" y="265" class="box-desc">beforeinput &amp; composition guard</text>
  <text x="105" y="290" class="box-code">Anti-paste · Dead-key &amp; IME safe</text>

  <!-- Interactive Display & HUD -->
  <rect x="445" y="180" width="340" height="125" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="465" y="212" class="box-title">Interactive Display &amp; HUD</text>
  <text x="465" y="240" class="box-desc">TypingDisplay: 5 visual states</text>
  <text x="465" y="265" class="box-desc">MetricsBar: live WPM &amp; accuracy</text>
  <text x="465" y="290" class="box-code">RTL direction &amp; tokenized words</text>

  <!-- Virtual Keyboard & Hand Guide -->
  <rect x="815" y="180" width="340" height="125" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="835" y="212" class="box-title">Virtual Keyboard &amp; Guide</text>
  <text x="835" y="240" class="box-desc">ANSI 15.0u geometric layouts</text>
  <text x="835" y="265" class="box-desc">Opposite-hand Shift illumination</text>
  <text x="835" y="290" class="box-code">QWERTY · US-Intl · Arabic 101</text>

  <!-- Multilingual Deck & Drawer -->
  <rect x="1185" y="180" width="330" height="125" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1205" y="212" class="box-title">Vocabulary &amp; Lookup</text>
  <text x="1205" y="240" class="box-desc">Interactive WordChip tokens</text>
  <text x="1205" y="265" class="box-desc">TranslationPanel slide drawer</text>
  <text x="1205" y="290" class="box-code">Timer auto-pause on lookup</text>

  <!-- Connectors Layer 1 to Layer 2 -->
  <path d="M250 305 V370" class="link"/>
  <path d="M615 305 V370" class="link"/>
  <path d="M985 305 V370" class="link"/>
  <path d="M1350 305 V370" class="link"/>

  <!-- Layer 2: Reactive State & Hooks (Middle) -->
  <rect x="60" y="375" width="1480" height="150" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
  <text x="85" y="407" class="layer-tag" fill="#0284c7">REACT HOOKS &amp; REACTIVE STORES · USE-SYNC-EXTERNAL-STORE</text>

  <rect x="85" y="425" width="330" height="85" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="457" class="box-title">useTypingSession</text>
  <text x="105" y="487" class="box-desc">Sync keystrokes &amp; 100ms ticker</text>

  <rect x="445" y="425" width="340" height="85" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="465" y="457" class="box-title">useKeyboard &amp; useLocale</text>
  <text x="465" y="487" class="box-desc">NFC resolution &amp; RTL switching</text>

  <rect x="815" y="425" width="340" height="85" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="835" y="457" class="box-title">useProgress &amp; usePreferences</text>
  <text x="835" y="487" class="box-desc">Cross-tab synced store adapters</text>

  <rect x="1185" y="425" width="330" height="85" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="1205" y="457" class="box-title">useVocabulary</text>
  <text x="1205" y="487" class="box-desc">Deck management &amp; review state</text>

  <!-- Connectors Layer 2 to Layer 3 -->
  <path d="M250 510 V575" class="link"/>
  <path d="M615 510 V575" class="link"/>
  <path d="M985 510 V575" class="link"/>
  <path d="M1350 510 V575" class="link"/>

  <!-- Layer 3: Domain Layer (Pure TypeScript, Zero DOM) -->
  <rect x="60" y="580" width="1480" height="155" rx="16" fill="#fdf4ff" stroke="#f0abfc" stroke-width="2"/>
  <text x="85" y="612" class="layer-tag" fill="#c026d3">DOMAIN ENGINES &amp; ALGORITHMS · PURE TYPESCRIPT (100% BRANCH COVERAGE)</text>

  <!-- Typing Engine State Machine -->
  <rect x="85" y="630" width="330" height="90" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
  <text x="105" y="660" class="box-title">Typing State Machine</text>
  <text x="105" y="685" class="box-desc">Pure immutable state transitions</text>
  <text x="105" y="707" class="box-code">Gross/Net WPM · pause deduction</text>

  <!-- Unicode & Text Processing -->
  <rect x="445" y="630" width="340" height="90" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
  <text x="465" y="660" class="box-title">Unicode Processing</text>
  <text x="465" y="685" class="box-desc">Intl.Segmenter graphemes &amp; NFC</text>
  <text x="465" y="707" class="box-code">Arabic Tashkeel stripping regex</text>

  <!-- Reflex Generator -->
  <rect x="815" y="630" width="340" height="90" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
  <text x="835" y="660" class="box-title">Reflex Generator</text>
  <text x="835" y="685" class="box-desc">32-bit Mulberry32 seeded PRNG</text>
  <text x="835" y="707" class="box-code">Key adjacency · adaptive weights</text>

  <!-- Guided Curriculum Engine -->
  <rect x="1185" y="630" width="330" height="90" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
  <text x="1205" y="660" class="box-title">Curriculum Gating</text>
  <text x="1205" y="685" class="box-desc">Cumulative key pool evaluation</text>
  <text x="1205" y="707" class="box-code">Accuracy &amp; speed threshold gates</text>

  <!-- Connectors Layer 3 to Layer 4 -->
  <path d="M445 735 V770 H250 V790" class="link"/>
  <path d="M1350 735 V790" class="link"/>

  <!-- Layer 4: Services & Data Persistence (Bottom) -->
  <rect x="60" y="795" width="1480" height="85" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="85" y="825" class="layer-tag" fill="#16a34a">SERVICES &amp; DATA PERSISTENCE · CLIENT-SIDE OFFLINE FIRST</text>

  <!-- Persistence Service -->
  <rect x="85" y="835" width="670" height="35" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="859" class="box-desc"><tspan font-weight="700">LocalStoragePersistence:</tspan> Versioned envelopes ({ _version: 1 }), schema migrations, SSR guard, JSON export/import</text>

  <!-- Translation Service & Dictionaries -->
  <rect x="785" y="835" width="730" height="35" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="859" class="box-desc"><tspan font-weight="700">OfflineTranslationProvider:</tspan> Curated bilingual datasets (EN, NL, AR across CEFR A1–B2) + Wiktionary fallback URLs</text>
</svg>
